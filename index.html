<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MochaTrade | Executive Market Sequencing</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            display: ['Outfit', 'sans-serif'],
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(30px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #030407;
      color: #f8fafc;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    .bg-noise {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 50;
    }

    .orb-1 {
      position: absolute; top: -10%; left: 20%; width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 60%);
      filter: blur(120px); pointer-events: none; z-index: 0;
    }
    .orb-2 {
      position: absolute; bottom: -10%; right: 10%; width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.1) 0%, transparent 60%);
      filter: blur(120px); pointer-events: none; z-index: 0;
    }

    .text-gradient {
      background: linear-gradient(to bottom right, #ffffff 10%, rgba(255, 255, 255, 0.4) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rank-card {
      position: relative;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: 24px;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      cursor: pointer;
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      border: 1px solid rgba(255, 255, 255, 0.03);
      overflow: hidden;
    }
    
    .rank-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(180deg, rgba(var(--card-theme), 0.5) 0%, rgba(255,255,255,0.02) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .rank-card:hover {
      transform: translateY(-4px) scale(1.01);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.8), 0 0 50px -20px rgba(var(--card-theme), 0.4);
    }

    .rank-card:hover::before {
      opacity: 1;
      padding: 2px;
      background: linear-gradient(180deg, rgba(var(--card-theme), 1) 0%, rgba(var(--card-theme), 0.1) 100%);
    }

    .launch-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      transition: all 0.4s ease;
      overflow: hidden;
    }
    .launch-btn::after {
      content: '';
      position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: all 0.6s ease;
    }
    .launch-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 30px rgba(255,255,255,0.1);
    }
    .launch-btn:hover::after {
      left: 200%;
    }
  </style>
</head>
<body class="relative antialiased selection:bg-white/20 pb-20 min-h-screen flex flex-col justify-between">

  <div class="bg-noise"></div>
  <div class="orb-1"></div>
  <div class="orb-2"></div>

  <!-- MINIMALIST NAVIGATION -->
  <nav class="relative z-10 w-full max-w-[1200px] mx-auto p-8 flex items-center justify-between opacity-0 animate-fade-in-up">
    <div class="flex items-center gap-4">
      <div class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center bg-white/5 shadow-lg">
        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14h16a8 8 0 0 1-16 0Z" />
          <path d="M8 10V6" />
          <path d="M12 10V4" />
          <path d="M16 10V2" />
        </svg>
      </div>
      <div>
        <h1 class="font-display font-medium text-xl text-white tracking-wide">MochaTrade</h1>
        <p class="font-mono text-[10px] text-slate-500 uppercase tracking-widest">Global Expansion Division</p>
      </div>
    </div>
    <div class="hidden md:flex items-center gap-2 px-4 py-1.5 rounded-full border border-white/5 bg-white/5 backdrop-blur-md font-mono text-[10px] text-slate-400 uppercase tracking-widest">
      <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></div>
      Executive Summary
    </div>
  </nav>

  <!-- MAIN HERO & RANKING LIST -->
  <main class="relative z-10 w-full max-w-[1000px] mx-auto px-6 flex flex-col items-center justify-center flex-1 mt-10 mb-16">
    
    <div class="text-center mb-16 opacity-0 animate-fade-in-up" style="animation-delay: 100ms;">
      <h2 class="font-mono text-xs md:text-sm tracking-[0.3em] text-slate-400 uppercase mb-6">Market Entry Readiness</h2>
      <h1 class="font-display font-light text-5xl md:text-7xl text-gradient tracking-tight leading-tight">
        Global Jurisdiction <br/> Sequencing
      </h1>
    </div>

    <!-- DYNAMIC RANKING CASCADE -->
    <div id="ranking-container" class="w-full space-y-6">
      <!-- Generated by JavaScript -->
    </div>

    <div class="mt-20 opacity-0 animate-fade-in-up" id="launch-btn-container">
      <a href="dashboard.html" class="launch-btn inline-flex items-center gap-4 px-8 py-4 cursor-pointer">
        <span class="font-mono text-xs uppercase tracking-[0.2em] text-white">Launch Interactive Console</span>
        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </a>
    </div>

  </main>

  <footer class="relative z-10 w-full text-center pb-8 opacity-0 animate-fade-in-up" id="footer-container">
    <p class="font-mono text-[10px] text-slate-600 uppercase tracking-widest">
      Confidential Intelligence • MarketSphere Hackathon 2026
    </p>
  </footer>

  <script>
    // 1. Core Default Data (Serves as the initial database seed)
    const DEFAULT_DATA = {
      IN: { 
        id: "India", flag: "IN", total: 37,
        modules: [
          { text: "Current operational baseline experiencing severe friction due to LRS capital controls and synthetic bans." }
        ]
      },
      CH: {
        id: "Switzerland", flag: "CH", color: "#10b981", total: 64,
        matrix: { reward: "Unmatched institutional credibility and zero FX controls natively protected under the FINMA DLT Act." }
      },
      AE: {
        id: "UAE", flag: "AE", color: "#0ea5e9", total: 58,
        matrix: { reward: "Zero tax drag and explicit FMP virtual asset licensing engineered specifically for leveraged derivatives." }
      },
      BR: {
        id: "Brazil", flag: "BR", color: "#f59e0b", total: 49,
        matrix: { reward: "Massive retail demographic fully integrated with Bacen's instant 24/7 Pix payment infrastructure." }
      }
    };

    function hexToRgb(hex) {
      return `${parseInt(hex.slice(1,3), 16)}, ${parseInt(hex.slice(3,5), 16)}, ${parseInt(hex.slice(5,7), 16)}`;
    }

    function renderHomepage() {
      let appData;
      
      // Pull the dynamic data from localStorage or seed it if empty
      try {
        const stored = localStorage.getItem('mocha_data');
        if (stored) {
          appData = JSON.parse(stored);
        } else {
          appData = DEFAULT_DATA;
          localStorage.setItem('mocha_data', JSON.stringify(appData));
        }
      } catch (e) {
        appData = DEFAULT_DATA;
      }

      const container = document.getElementById('ranking-container');
      container.innerHTML = '';

      // Separate and sort targets
      const targetKeys = Object.keys(appData).filter(k => k !== 'IN');
      const sortedTargets = targetKeys.map(k => ({ code: k, ...appData[k] })).sort((a, b) => b.total - a.total);

      let delay = 100;

      // Render Dynamic Ranks
      sortedTargets.forEach((t, index) => {
        const rankStr = String(index + 1).padStart(2, '0');
        const rgbColor = hexToRgb(t.color);
        
        container.innerHTML += `
          <div onclick="window.location.href='dashboard.html'" class="rank-card group flex flex-col md:flex-row items-start md:items-center justify-between p-6 md:p-8 animate-fade-in-up" style="--card-theme: ${rgbColor}; animation-delay: ${delay}ms; opacity: 0;">
            <div class="flex items-center gap-8 md:gap-12 w-full md:w-auto">
              <div class="flex flex-col items-center justify-center min-w-[80px]">
                <span class="font-mono text-[10px] font-medium tracking-widest uppercase mb-1" style="color: ${t.color}">Rank</span>
                <span class="font-display text-4xl md:text-5xl font-light text-white group-hover:text-[${t.color}] transition-colors">${rankStr}</span>
              </div>
              <div class="flex-1 border-l border-white/10 pl-8 md:pl-12 py-2">
                <div class="flex items-center gap-4 mb-2">
                  <span class="text-4xl drop-shadow-xl select-none group-hover:scale-110 transition-transform font-mono tracking-tighter text-white/20">${t.flag}</span>
                  <h3 class="font-display text-3xl text-white">${t.id}</h3>
                </div>
                <p class="font-light text-sm md:text-base text-slate-400 leading-relaxed max-w-lg">
                  ${t.matrix.reward}
                </p>
              </div>
            </div>
            <div class="mt-6 md:mt-0 pt-6 md:pt-0 border-t md:border-t-0 md:border-l border-white/10 w-full md:w-auto md:pl-12 flex md:flex-col items-end justify-between md:justify-center">
              <span class="font-mono text-[10px] text-slate-500 uppercase tracking-widest md:mb-2">Suitability</span>
              <div class="font-mono text-4xl font-light tracking-tight" style="color: ${t.color}">${t.total}<span class="text-xl text-slate-600">/70</span></div>
            </div>
          </div>
        `;
        delay += 100;
      });

      // Render Baseline (India)
      const iData = appData['IN'];
      if(iData) {
        container.innerHTML += `
          <div onclick="window.location.href='dashboard.html'" class="rank-card group opacity-50 hover:opacity-100 flex flex-col md:flex-row items-start md:items-center justify-between p-6 md:p-8 animate-fade-in-up" style="--card-theme: 100, 116, 139; animation-delay: ${delay}ms; opacity: 0;">
            <div class="flex items-center gap-8 md:gap-12 w-full md:w-auto">
              <div class="flex flex-col items-center justify-center min-w-[80px]">
                <span class="font-mono text-[10px] text-slate-400 font-medium tracking-[0.2em] uppercase mb-1">Reference</span>
                <span class="font-display text-3xl md:text-4xl font-light text-slate-500 group-hover:text-slate-300 transition-colors">Base</span>
              </div>
              <div class="flex-1 border-l border-white/10 pl-8 md:pl-12 py-2">
                <div class="flex items-center gap-4 mb-2">
                  <span class="text-4xl drop-shadow-xl select-none group-hover:scale-110 transition-transform font-mono tracking-tighter text-white/20">IN</span>
                  <h3 class="font-display text-2xl md:text-3xl text-slate-300">${iData.id}</h3>
                </div>
                <p class="font-light text-sm md:text-base text-slate-500 leading-relaxed max-w-lg">
                  ${iData.modules[0].text}
                </p>
              </div>
            </div>
            <div class="mt-6 md:mt-0 pt-6 md:pt-0 border-t md:border-t-0 md:border-l border-white/10 w-full md:w-auto md:pl-12 flex md:flex-col items-end justify-between md:justify-center">
              <span class="font-mono text-[10px] text-slate-600 uppercase tracking-widest md:mb-2">Suitability</span>
              <div class="font-mono text-4xl font-light tracking-tight text-slate-400">${iData.total}<span class="text-xl text-slate-600">/70</span></div>
            </div>
          </div>
        `;
      }
      
      // Update UI delay timings for final elements
      document.getElementById('launch-btn-container').style.animationDelay = `${delay + 100}ms`;
      document.getElementById('footer-container').style.animationDelay = `${delay + 200}ms`;
    }

    // Automatically rebuild the page if the dashboard adds an AI country
    window.addEventListener('storage', (e) => {
      if (e.key === 'mocha_data') {
        renderHomepage();
      }
    });

    window.onload = renderHomepage;
  </script>
</body>
</html>
